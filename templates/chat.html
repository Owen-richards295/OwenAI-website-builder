<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Owen — Build Console</title>

<style>
  :root {
    --bg: #131416;
    --panel: #1a1c1f;
    --border: #2a2d31;
    --text: #e8e6e1;
    --text-dim: #8a8d92;
    --accent: #ff7a33;
    --accent-dim: #6b3a1f;
    --mono: 'JetBrains Mono', 'SF Mono', Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    border-bottom: 1px solid var(--border);
    padding: 14px 20px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }

  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 8px var(--accent);
  }

  header .label {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--text-dim);
  }

  header .label b {
    color: var(--text);
    font-weight: 600;
  }

  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 24px 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    max-width: 760px;
    width: 100%;
    margin: 0 auto;
  }

  .empty {
    margin: auto;
    text-align: center;
    color: var(--text-dim);
    font-family: var(--mono);
  }

  .empty .big-dot {
    width: 12px;
    height: 12px;
    margin: 0 auto 16px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 20px var(--accent);
  }

  .empty h2 {
    color: var(--text);
    font-family: var(--sans);
    font-size: 22px;
    margin-bottom: 8px;
  }

  .empty p {
    max-width: 500px;
    margin: auto;
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.6;
  }

  .msg {
    display: flex;
    flex-direction: column;
    gap: 4px;
    max-width: 80%;
  }

  .msg.user {
    align-self: flex-end;
    align-items: flex-end;
  }

  .msg.ai {
    align-self: flex-start;
    align-items: flex-start;
  }

  .who {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  .bubble {
    padding: 10px 14px;
    border-radius: 10px;
    line-height: 1.5;
    font-size: 14.5px;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }

  .msg.user .bubble {
    background: var(--accent);
    color: #1a1000;
    border-bottom-right-radius: 2px;
  }

  .msg.ai .bubble {
    background: var(--panel);
    border: 1px solid var(--border);
    border-bottom-left-radius: 2px;
  }

  form#composer {
    border-top: 1px solid var(--border);
    padding: 16px 20px;
    flex-shrink: 0;
  }

  .composer-inner {
    max-width: 760px;
    margin: 0 auto;
    display: flex;
    gap: 10px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 6px 6px 6px 14px;
  }

  .composer-inner:focus-within {
    border-color: var(--accent-dim);
  }

  textarea#input {
    flex: 1;
    background: none;
    border: none;
    outline: none;
    resize: vertical;
    color: var(--text);
    font-family: var(--sans);
    font-size: 14.5px;
    line-height: 1.5;
    padding: 8px 0;
    min-height: 40px;
    max-height: 140px;
  }

  textarea#input::placeholder {
    color: var(--text-dim);
  }

  button#send {
    background: var(--accent);
    color: #1a1000;
    border: none;
    border-radius: 7px;
    padding: 0 18px;
    min-height: 40px;
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    align-self: flex-end;
  }

  button#send:hover {
    opacity: 0.85;
  }

  button#send:focus-visible,
  textarea#input:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  #chat::-webkit-scrollbar {
    width: 8px;
  }

  #chat::-webkit-scrollbar-thumb {
    background: var(--border);
    border-radius: 4px;
  }

  @media (max-width: 600px) {
    #chat {
      padding: 18px 14px;
    }

    form#composer {
      padding: 12px 14px;
    }

    .msg {
      max-width: 90%;
    }
  }
</style>
</head>

<body>

<header>
  <div class="dot"></div>
  <div class="label">
    <b>owen</b> — build console
  </div>
</header>

<div id="chat">

  {% if not message %}
    <div class="empty">
      <div class="big-dot"></div>
      <h2>What should Owen build?</h2>
      <p>
        Describe the website you want to create.
        Owen will generate the files and build the project.
      </p>
    </div>
  {% endif %}

  {% for user_message, ai_reply in message %}
    <div class="msg user">
      <div class="who">you</div>
      <div class="bubble">{{ user_message }}</div>
    </div>

    <div class="msg ai">
      <div class="who">owen</div>
      <div class="bubble">{{ ai_reply }}</div>
    </div>
  {% endfor %}

</div>

<form id="composer" method="POST" action="/">
  <div class="composer-inner">

    <textarea
      id="input"
      name="content"
      rows="1"
      placeholder="Tell Owen what to build..."
      required
    ></textarea>

    <button id="send" type="submit">
      send
    </button>

  </div>
</form>

</body>
</html>
